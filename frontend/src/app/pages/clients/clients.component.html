<div class="container">

  <div class="card">

    <!-- HEADER -->
    <div class="header">
      <h2>👤 Gestion des clients</h2>
      <p>CRUD complet : Ajouter • Modifier • Supprimer</p>
    </div>

    <!-- ALERTS -->
    <div *ngIf="errorMessage" class="error">
      {{ errorMessage }}
    </div>

    <div *ngIf="successMessage" class="success">
      {{ successMessage }}
    </div>

    <!-- FORM -->
    <div class="form">

      <input [(ngModel)]="client.nom" placeholder="Nom">
      <input [(ngModel)]="client.prenom" placeholder="Prénom">
      <input [(ngModel)]="client.telephone" placeholder="Téléphone">
      <input [(ngModel)]="client.email" placeholder="Email">

      <div *ngIf="formError" class="error">
        ❌ Veuillez remplir tous les champs
      </div>

      <button class="btn-primary" (click)="save()">
        {{ editMode ? '✏️ Modifier client' : '➕ Ajouter client' }}
      </button>

      <button *ngIf="editMode" class="btn-cancel" (click)="reset()">
        ❌ Annuler
      </button>

    </div>

    <!-- TABLE -->
    <div class="table-container">

      <table *ngIf="clients.length > 0; else noData">

        <thead>
          <tr>
            <th>ID</th>
            <th>Nom</th>
            <th>Prénom</th>
            <th>Téléphone</th>
            <th>Email</th>
            <th>Actions</th>
          </tr>
        </thead>

        <tbody>

          <tr *ngFor="let c of clients">

            <td>{{ c.idClient }}</td>
            <td>{{ c.nom }}</td>
            <td>{{ c.prenom }}</td>
            <td>{{ c.telephone }}</td>
            <td>{{ c.email }}</td>

            <td>

              <button class="btn-edit" (click)="edit(c)">✏️</button>

              <!-- 🔥 UNE SEULE MÉTHODE -->
              <button class="btn-delete" (click)="confirmDelete(c.idClient)">
                🗑️
              </button>

            </td>

          </tr>

        </tbody>

      </table>

      <ng-template #noData>
        <div class="empty">
          ❌ Aucun client trouvé
        </div>
      </ng-template>

    </div>

  </div>

</div>
